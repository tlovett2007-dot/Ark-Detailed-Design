<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"
  font-family="Georgia, serif" font-size="13" fill="#1a1a1a">

<title>Tebah transmission tree</title>
<desc>Branching diagram showing how the Hebrew word tebah was transmitted through different traditions.</desc>

<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arr-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#aaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="1400" height="1000" fill="#f9f7f4"/>

<!-- ══ LEGEND ══ -->
<text x="40" y="22" font-weight="bold" font-size="12">Legend:</text>
<line x1="100" y1="18" x2="140" y2="18" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="148" y="22" font-size="12">Direct transmission</text>
<line x1="320" y1="18" x2="360" y2="18" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-d)"/>
<text x="368" y="22" font-size="12">Indirect / ignored / lost</text>
<rect x="560" y="10" width="16" height="16" rx="3" fill="none" stroke="#2c4a2e" stroke-width="2"/>
<text x="582" y="22" font-size="12">[BOAT ICON] Ship / functional — no geometry</text>
<rect x="880" y="10" width="16" height="16" rx="3" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="902" y="22" font-size="12">[BOX ICON] Box / chest imposed</text>
<rect x="1100" y="10" width="16" height="16" rx="3" fill="none" stroke="#aaa" stroke-width="1"/>
<text x="1122" y="22" font-size="12">Neutral / peripheral</text>

<!-- ══════════════
     NODES
     w=210 h=52 rx=5
     ══════════════ -->

<!-- N01: Hebrew tebah — NO SHAPE -->
<rect x="595" y="60" width="210" height="52" rx="5" fill="none" stroke="#aaa" stroke-width="1.5"/>
<text x="700" y="81" text-anchor="middle" font-weight="bold">Hebrew תֵּבָה (tebah)</text>
<text x="700" y="100" text-anchor="middle" font-size="12" fill="#666">functional vessel — no shape, no etymology</text>

<!-- N02: LXX kibotos — BOX -->
<rect x="60" y="180" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="165" y="201" text-anchor="middle" font-weight="bold">LXX κιβωτός</text>
<text x="165" y="220" text-anchor="middle" font-size="12" fill="#666">Alexandria c.250 BC — box imposed</text>

<!-- N03: Aramaic Targum — NO SHAPE -->
<rect x="1130" y="180" width="210" height="52" rx="5" fill="none" stroke="#aaa" stroke-width="1.5"/>
<text x="1235" y="201" text-anchor="middle" font-weight="bold">Aramaic תֵּיבוּ</text>
<text x="1235" y="220" text-anchor="middle" font-size="12" fill="#666">Targum Onkelos — functional</text>

<!-- N04: Vulgate arca — BOX -->
<rect x="60" y="320" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="165" y="341" text-anchor="middle" font-weight="bold">Vulgate arca</text>
<text x="165" y="360" text-anchor="middle" font-size="12" fill="#666">Jerome c.400 AD — chest/box</text>
<text x="165" y="386" text-anchor="middle" font-size="11" fill="#aaa">Moses = fiscella scirpea (rush basket)</text>
<text x="165" y="400" text-anchor="middle" font-size="11" fill="#aaa">Jerome preserved the distinction</text>

<!-- N05: Syriac qebuta — NO SHAPE -->
<rect x="1130" y="320" width="210" height="52" rx="5" fill="none" stroke="#aaa" stroke-width="1.5"/>
<text x="1235" y="341" text-anchor="middle" font-weight="bold">Syriac qebūtā</text>
<text x="1235" y="360" text-anchor="middle" font-size="12" fill="#666">Noah + Moses + Covenant</text>

<!-- N06: Brugsch 1867 — BOX source -->
<rect x="310" y="320" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="415" y="341" text-anchor="middle" font-weight="bold">Brugsch 1867–1882</text>
<text x="415" y="360" text-anchor="middle" font-size="12" fill="#666">proposed tebah = Egyptian db't</text>
<text x="415" y="386" text-anchor="middle" font-size="11" fill="#aaa">pre-rigorous phonological standards</text>
<text x="415" y="400" text-anchor="middle" font-size="11" fill="#aaa">greatest Egyptologist of his era</text>

<!-- N07: Wycliffe — BOX -->
<rect x="60" y="460" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="165" y="481" text-anchor="middle" font-weight="bold">Wycliffe "ark" 1382</text>
<text x="165" y="500" text-anchor="middle" font-size="12" fill="#666">first English — from Vulgate not Hebrew</text>
<text x="165" y="526" text-anchor="middle" font-size="11" fill="#aaa">coined English word that locked in the box</text>

<!-- N08: Erman 1892 — BOX source -->
<rect x="310" y="460" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="415" y="481" text-anchor="middle" font-weight="bold">Erman 1892</text>
<text x="415" y="500" text-anchor="middle" font-size="12" fill="#666">accepted Brugsch eq. — ZDMG 46:123</text>
<text x="415" y="526" text-anchor="middle" font-size="11" fill="#aaa">later omitted from his own Wörterbuch 1926</text>
<text x="415" y="540" text-anchor="middle" font-size="11" fill="#aaa">quietly withdrew it — nobody noticed</text>

<!-- N09: Arabic tabut — NO SHAPE -->
<rect x="1130" y="460" width="210" height="52" rx="5" fill="none" stroke="#aaa" stroke-width="1.5"/>
<text x="1235" y="481" text-anchor="middle" font-weight="bold">Arabic تابوت (tābūt)</text>
<text x="1235" y="500" text-anchor="middle" font-size="12" fill="#666">functional container — no geometry</text>

<!-- N10: Cohen 1972 — NO SHAPE (corrected) -->
<rect x="595" y="460" width="210" height="52" rx="5" fill="none" stroke="#2c4a2e" stroke-width="2"/>
<text x="700" y="481" text-anchor="middle" font-weight="bold" fill="#2c4a2e">Cohen 1972</text>
<text x="700" y="500" text-anchor="middle" font-size="12" fill="#2c4a2e">"Etymology undetermined" — unrebutted</text>
<text x="700" y="526" text-anchor="middle" font-size="11" fill="#aaa">JANES 4:37–51 — cited, never engaged</text>

<!-- N11: English vocabulary — BOX -->
<rect x="60" y="600" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="165" y="621" text-anchor="middle" font-weight="bold">English vocabulary</text>
<text x="165" y="640" text-anchor="middle" font-size="12" fill="#666">"ark" = box before any Hebrew scholar</text>
<text x="165" y="666" text-anchor="middle" font-size="11" fill="#aaa">Tyndale (1530) back to Hebrew —</text>
<text x="165" y="680" text-anchor="middle" font-size="11" fill="#aaa">still wrote "ark" — word already fixed</text>

<!-- N12: BDB 1906 — BOX hub -->
<rect x="310" y="600" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="415" y="621" text-anchor="middle" font-weight="bold">BDB 1906</text>
<text x="415" y="640" text-anchor="middle" font-size="12" fill="#666">"prob. Egyptian loanword" — hub node</text>
<text x="415" y="666" text-anchor="middle" font-size="11" fill="#aaa">Lambdin (1953) omits tebah entirely</text>
<text x="415" y="680" text-anchor="middle" font-size="11" fill="#aaa">Cohen (1972) demolishes — ignored</text>

<!-- N13: Quran — SHIP -->
<rect x="1130" y="600" width="210" height="52" rx="5" fill="none" stroke="#2c4a2e" stroke-width="2"/>
<text x="1235" y="621" text-anchor="middle" font-weight="bold" fill="#2c4a2e">Quran سفينة / فلك</text>
<text x="1235" y="640" text-anchor="middle" font-size="12" fill="#2c4a2e">safina / fulk — ship c.610 AD</text>
<text x="1235" y="666" text-anchor="middle" font-size="11" fill="#aaa">independently preserves ship reading</text>

<!-- N14: Coptic thebi — NO SHAPE -->
<rect x="870" y="460" width="210" height="52" rx="5" fill="none" stroke="#aaa" stroke-width="1"/>
<text x="975" y="481" text-anchor="middle" font-weight="bold">Coptic thebi</text>
<text x="975" y="500" text-anchor="middle" font-size="12" fill="#666">Exodus 2 — word preserved, no shape</text>

<!-- N15: Tyndale/KJV — BOX -->
<rect x="60" y="740" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="165" y="761" text-anchor="middle" font-weight="bold">Tyndale 1530 → KJV 1611</text>
<text x="165" y="780" text-anchor="middle" font-size="12" fill="#666">Hebrew scholar — still wrote "ark"</text>

<!-- N16: Academic consensus — BOX -->
<rect x="310" y="740" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="415" y="761" text-anchor="middle" font-weight="bold">Academic consensus</text>
<text x="415" y="780" text-anchor="middle" font-size="12" fill="#666">Cassuto, Wenham, Spoelstra…</text>

<!-- N17: HALOT 1994 — SHIP -->
<rect x="595" y="740" width="210" height="52" rx="5" fill="none" stroke="#2c4a2e" stroke-width="2"/>
<text x="700" y="761" text-anchor="middle" font-weight="bold" fill="#2c4a2e">HALOT 1994</text>
<text x="700" y="780" text-anchor="middle" font-size="12" fill="#2c4a2e">"Decision open" — "vessel was a ship"</text>
<text x="700" y="806" text-anchor="middle" font-size="11" fill="#aaa">Cohen not cited — same conclusion</text>

<!-- N18: Ibn Abbas — SHIP -->
<rect x="1130" y="740" width="210" height="52" rx="5" fill="none" stroke="#2c4a2e" stroke-width="2"/>
<text x="1235" y="761" text-anchor="middle" font-weight="bold" fill="#2c4a2e">Ibn Abbas c.650 AD</text>
<text x="1235" y="780" text-anchor="middle" font-size="12" fill="#2c4a2e">"Shape like a bird's belly"</text>

<!-- N19: Every English reader — BOX -->
<rect x="60" y="880" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="165" y="901" text-anchor="middle" font-weight="bold">Every English reader since</text>
<text x="165" y="920" text-anchor="middle" font-size="12" fill="#666">incl. Hollywood (Noah 2014)</text>

<!-- N20: Academic consensus terminal — BOX -->
<rect x="310" y="880" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="415" y="901" text-anchor="middle" font-weight="bold">Still running 2026</text>
<text x="415" y="920" text-anchor="middle" font-size="12" fill="#666">Hoffmeier, Tigay, Spoelstra…</text>

<!-- N21: AiG Ark Encounter — SHIP -->
<rect x="595" y="880" width="210" height="52" rx="5" fill="none" stroke="#2c4a2e" stroke-width="2"/>
<text x="700" y="901" text-anchor="middle" font-weight="bold" fill="#2c4a2e">AiG Ark Encounter</text>
<text x="700" y="920" text-anchor="middle" font-size="12" fill="#2c4a2e">ship-shaped — Cohen taken seriously</text>

<!-- N22: Ethiopic tabot — SHIP -->
<rect x="1130" y="880" width="210" height="52" rx="5" fill="none" stroke="#2c4a2e" stroke-width="2"/>
<text x="1235" y="901" text-anchor="middle" font-weight="bold" fill="#2c4a2e">Ethiopic tābot</text>
<text x="1235" y="920" text-anchor="middle" font-size="12" fill="#2c4a2e">Noah + Moses + Covenant — ship</text>

