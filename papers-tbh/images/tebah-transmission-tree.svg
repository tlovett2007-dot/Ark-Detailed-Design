<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1400 1200"
  font-family="Georgia, serif" font-size="13" fill="#1a1a1a">

<title>Tebah transmission tree</title>
<desc>Branching diagram showing how the Hebrew word tebah was transmitted through different traditions, with box and ship readings diverging from the LXX onwards.</desc>

<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arr-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#aaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="1400" height="1200" fill="#f9f7f4"/>

<!-- LEGEND -->
<line x1="40" y1="28" x2="80" y2="28" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="88" y="33" font-size="12">Direct transmission</text>
<line x1="240" y1="28" x2="280" y2="28" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-d)"/>
<text x="288" y="33" font-size="12">Indirect / ignored / lost</text>
<rect x="460" y="18" width="18" height="18" rx="3" fill="none" stroke="#2c4a2e" stroke-width="2"/>
<text x="484" y="31" font-size="12">Ship / functional reading</text>
<rect x="660" y="18" width="18" height="18" rx="3" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="684" y="31" font-size="12">Box / chest reading</text>
<rect x="840" y="18" width="18" height="18" rx="3" fill="none" stroke="#aaa" stroke-width="1"/>
<text x="864" y="31" font-size="12">Neutral / peripheral</text>

<!-- ══ LEVEL 1 — ROOT ══ -->
<!-- x=595 y=60 w=210 h=52 -->
<rect x="595" y="60" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="700" y="81" text-anchor="middle" font-weight="bold">Hebrew תֵּבָה</text>
<text x="700" y="100" text-anchor="middle" font-size="12" fill="#666">functional vessel — etymology unknown</text>

<!-- ══ LEVEL 2 — THREE BRANCHES ══ -->
<!-- LXX: x=60  Berosus: x=595  Aramaic: x=1130 -->

<!-- connectors from root -->
<path d="M640 112 L165 180" fill="none" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>
<path d="M700 112 L700 180" fill="none" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>
<path d="M760 112 L1235 180" fill="none" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>

<!-- L2a LXX kibotos — box -->
<rect x="60" y="180" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="165" y="201" text-anchor="middle" font-weight="bold">LXX κιβωτός</text>
<text x="165" y="220" text-anchor="middle" font-size="12" fill="#666">Alexandria c.250 BC — box imposed</text>

<!-- L2b Berosus ploion — ship -->
<rect x="595" y="180" width="210" height="52" rx="5" fill="none" stroke="#2c4a2e" stroke-width="2"/>
<text x="700" y="201" text-anchor="middle" font-weight="bold" fill="#2c4a2e">Berosus πλοῖον</text>
<text x="700" y="220" text-anchor="middle" font-size="12" fill="#2c4a2e">c.280 BC — ship (Babylonian)</text>

<!-- L2c Aramaic — functional -->
<rect x="1130" y="180" width="210" height="52" rx="5" fill="none" stroke="#aaa" stroke-width="1.5"/>
<text x="1235" y="201" text-anchor="middle" font-weight="bold">Aramaic תֵּיבוּ</text>
<text x="1235" y="220" text-anchor="middle" font-size="12" fill="#666">Targum Onkelos — functional</text>

<!-- ══ LEVEL 3 ══ -->
<!-- Josephus x=60  Vulgate x=280  Fragments x=595  Syriac x=1130 -->

<!-- connectors -->
<path d="M115 232 L115 300" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr-d)"/>
<path d="M215 232 L335 300" fill="none" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>
<path d="M700 232 L700 300" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr-d)"/>
<path d="M1235 232 L1235 300" fill="none" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>

<!-- L3a Josephus larnax -->
<rect x="20" y="300" width="190" height="52" rx="5" fill="none" stroke="#aaa" stroke-width="1"/>
<text x="115" y="321" text-anchor="middle" font-weight="bold">Josephus λάρναξ</text>
<text x="115" y="340" text-anchor="middle" font-size="12" fill="#666">c.94 AD — Deucalion's word</text>
<text x="115" y="366" text-anchor="middle" font-size="11" fill="#aaa">knew dimensions — used anyway</text>
<text x="115" y="380" text-anchor="middle" font-size="11" fill="#aaa">"textual vandalism"</text>

<!-- L3b Vulgate arca -->
<rect x="230" y="300" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="335" y="321" text-anchor="middle" font-weight="bold">Vulgate arca</text>
<text x="335" y="340" text-anchor="middle" font-size="12" fill="#666">Jerome c.400 AD — chest/box</text>
<text x="335" y="366" text-anchor="middle" font-size="11" fill="#aaa">Moses = fiscella scirpea (rush basket)</text>
<text x="335" y="380" text-anchor="middle" font-size="11" fill="#aaa">Jerome knew the difference</text>

<!-- L3c Berosus fragments lost -->
<rect x="595" y="300" width="210" height="52" rx="5" fill="none" stroke="#aaa" stroke-width="1"/>
<text x="700" y="321" text-anchor="middle" font-weight="bold" fill="#aaa">Fragments — lost</text>
<text x="700" y="340" text-anchor="middle" font-size="12" fill="#aaa">Ship reading buried here</text>

<!-- L3d Syriac qebuta -->
<rect x="1130" y="300" width="210" height="52" rx="5" fill="none" stroke="#aaa" stroke-width="1.5"/>
<text x="1235" y="321" text-anchor="middle" font-weight="bold">Syriac qebūtā</text>
<text x="1235" y="340" text-anchor="middle" font-size="12" fill="#666">Noah + Moses + Covenant</text>

<!-- ══ LEVEL 4 ══ -->
<!-- Wycliffe x=335  Arabic x=1235 -->
<path d="M335 352 L335 420" fill="none" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>
<path d="M1235 352 L1235 420" fill="none" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>

<!-- L4a Wycliffe -->
<rect x="230" y="420" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="335" y="441" text-anchor="middle" font-weight="bold">Wycliffe "ark" 1382</text>
<text x="335" y="460" text-anchor="middle" font-size="12" fill="#666">First English — from Vulgate not Hebrew</text>
<text x="335" y="486" text-anchor="middle" font-size="11" fill="#aaa">coined the English word that locked in the box</text>

<!-- L4b Arabic tabut -->
<rect x="1130" y="420" width="210" height="52" rx="5" fill="none" stroke="#aaa" stroke-width="1.5"/>
<text x="1235" y="441" text-anchor="middle" font-weight="bold">Arabic تابوت</text>
<text x="1235" y="460" text-anchor="middle" font-size="12" fill="#666">tābūt — functional, no geometry</text>

<!-- ══ LEVEL 5 ══ -->
<!-- English vocab x=335  Cohen x=700  Quran x=1235 -->
<path d="M335 472 L335 540" fill="none" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>
<path d="M1235 472 L1235 540" fill="none" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>

<!-- L5a English vocabulary -->
<rect x="230" y="540" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="335" y="561" text-anchor="middle" font-weight="bold">English vocabulary</text>
<text x="335" y="580" text-anchor="middle" font-size="12" fill="#666">"ark" = box before any Hebrew scholar</text>
<text x="335" y="606" text-anchor="middle" font-size="11" fill="#aaa">Tyndale (1530) went to Hebrew —</text>
<text x="335" y="620" text-anchor="middle" font-size="11" fill="#aaa">still wrote "ark" — word already fixed</text>

<!-- Cohen 1972 — corrected exemplar -->
<rect x="595" y="420" width="210" height="52" rx="5" fill="none" stroke="#2c4a2e" stroke-width="2"/>
<text x="700" y="441" text-anchor="middle" font-weight="bold" fill="#2c4a2e">Cohen 1972</text>
<text x="700" y="460" text-anchor="middle" font-size="12" fill="#2c4a2e">"Etymology undetermined" — unrebutted</text>
<text x="700" y="486" text-anchor="middle" font-size="11" fill="#aaa">JANES 4:37–51 — cited, never engaged</text>

<!-- L5b Quran -->
<rect x="1130" y="540" width="210" height="52" rx="5" fill="none" stroke="#2c4a2e" stroke-width="2"/>
<text x="1235" y="561" text-anchor="middle" font-weight="bold" fill="#2c4a2e">Quran سفينة / فلك</text>
<text x="1235" y="580" text-anchor="middle" font-size="12" fill="#2c4a2e">safina / fulk — ship c.610 AD</text>
<text x="1235" y="606" text-anchor="middle" font-size="11" fill="#aaa">does NOT use tābūt for Noah</text>
<text x="1235" y="620" text-anchor="middle" font-size="11" fill="#aaa">Noah's ark = ocean-going ship</text>

<!-- ══ LEVEL 6 ══ -->
<!-- BDB x=335  HALOT x=700  Ibn Abbas x=1235 -->

<!-- English vocab to Tyndale/KJV -->
<path d="M335 592 L335 660" fill="none" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>

<!-- BDB from Brugsch via Erman — sits alongside -->
<rect x="460" y="540" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="565" y="561" text-anchor="middle" font-weight="bold">BDB 1906</text>
<text x="565" y="580" text-anchor="middle" font-size="12" fill="#666">"prob. Egyptian loanword" — Brugsch eq.</text>
<!-- BDB from English vocab chain -->
<path d="M440 566 L462 566" fill="none" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>
<!-- Cohen ignored into BDB stream -->
<path d="M668 446 L613 538" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr-d)"/>
<text x="620" y="502" text-anchor="middle" font-size="11" fill="#aaa">ignored</text>

<!-- BDB to academic consensus -->
<path d="M565 592 L565 660" fill="none" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>

<!-- Quran to Ibn Abbas -->
<path d="M1235 592 L1235 660" fill="none" stroke="#2c4a2e" stroke-width="1" marker-end="url(#arr)"/>

<!-- HALOT -->
<rect x="730" y="540" width="210" height="52" rx="5" fill="none" stroke="#2c4a2e" stroke-width="2"/>
<text x="835" y="561" text-anchor="middle" font-weight="bold" fill="#2c4a2e">HALOT 1994</text>
<text x="835" y="580" text-anchor="middle" font-size="12" fill="#2c4a2e">"Decision open" — "vessel was a ship"</text>
<!-- BDB to HALOT dashed -->
<path d="M670 566 L728 566" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr-d)"/>
<text x="700" y="558" text-anchor="middle" font-size="11" fill="#aaa">partially</text>
<text x="700" y="570" text-anchor="middle" font-size="11" fill="#aaa">corrected</text>

<!-- L6a Tyndale/KJV -->
<rect x="230" y="660" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="335" y="681" text-anchor="middle" font-weight="bold">Tyndale 1530 → KJV 1611</text>
<text x="335" y="700" text-anchor="middle" font-size="12" fill="#666">Hebrew scholar — still wrote "ark"</text>

<!-- L6b Academic consensus -->
<rect x="460" y="660" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="565" y="681" text-anchor="middle" font-weight="bold">Academic consensus</text>
<text x="565" y="700" text-anchor="middle" font-size="12" fill="#666">Cassuto, Wenham, Spoelstra…</text>

<!-- L6c Ibn Abbas -->
<rect x="1130" y="660" width="210" height="52" rx="5" fill="none" stroke="#2c4a2e" stroke-width="2"/>
<text x="1235" y="681" text-anchor="middle" font-weight="bold" fill="#2c4a2e">Ibn Abbas c.650 AD</text>
<text x="1235" y="700" text-anchor="middle" font-size="12" fill="#2c4a2e">"Shape like a bird's belly"</text>

<!-- ══ LEVEL 7 — TERMINAL NODES ══ -->
<path d="M335 712 L335 780" fill="none" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>
<path d="M565 712 L565 780" fill="none" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>
<path d="M1235 712 L1235 780" fill="none" stroke="#2c4a2e" stroke-width="1" marker-end="url(#arr)"/>

<!-- HALOT to AiG -->
<path d="M835 592 L900 778" fill="none" stroke="#2c4a2e" stroke-width="1" marker-end="url(#arr)"/>
<!-- Cohen to AiG via Lovett -->
<path d="M700 472 L900 778" fill="none" stroke="#2c4a2e" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr-d)"/>
<text x="760" y="650" font-size="11" fill="#2c4a2e">Lovett 2006</text>

<!-- L7a Every English reader -->
<rect x="230" y="780" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="335" y="801" text-anchor="middle" font-weight="bold">Every English reader since</text>
<text x="335" y="820" text-anchor="middle" font-size="12" fill="#666">incl. Hollywood (Noah 2014)</text>

<!-- L7b Sarfati 2026 -->
<rect x="460" y="780" width="210" height="52" rx="5" fill="none" stroke="#444" stroke-width="1.5"/>
<text x="565" y="801" text-anchor="middle" font-weight="bold">Sarfati 2026</text>
<text x="565" y="820" text-anchor="middle" font-size="12" fill="#666">"box-shaped vessel" — no source</text>

<!-- L7c AiG Ark Encounter -->
<rect x="730" y="780" width="210" height="52" rx="5" fill="none" stroke="#2c4a2e" stroke-width="2"/>
<text x="835" y="801" text-anchor="middle" font-weight="bold" fill="#2c4a2e">AiG Ark Encounter</text>
<text x="835" y="820" text-anchor="middle" font-size="12" fill="#2c4a2e">ship-shaped — Cohen taken seriously</text>

<!-- L7d Ethiopic tabot -->
<rect x="1130" y="780" width="210" height="52" rx="5" fill="none" stroke="#2c4a2e" stroke-width="2"/>
<text x="1235" y="801" text-anchor="middle" font-weight="bold" fill="#2c4a2e">Ethiopic tābot</text>
<text x="1235" y="820" text-anchor="middle" font-size="12" fill="#2c4a2e">Noah + Moses + Covenant — ship</text>

<!-- Coptic thebi — off Aramaic branch -->
<rect x="930" y="660" width="190" height="52" rx="5" fill="none" stroke="#aaa" stroke-width="1"/>
<text x="1025" y="681" text-anchor="middle" font-weight="bold">Coptic thebi</text>
<text x="1025" y="700" text-anchor="middle" font-size="12" fill="#666">Exodus 2 — functional</text>
<path d="M1185 256 L1025 658" fill="none" stroke="#aaa" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arr-d)"/>

<!-- FOOTER -->
<text x="700" y="880" text-anchor="middle" font-size="11" fill="#888">Green outline = ship / functional reading | Gray outline = box / chest reading | Thin gray = neutral or lost</text>
<text x="700" y="898" text-anchor="middle" font-size="11" fill="#888">Solid arrows = direct transmission | Dashed arrows = indirect, ignored, or partial</text>
<text x="700" y="916" text-anchor="middle" font-size="11" fill="#888">T. Lovett — Noah's Ark Naval Architecture Research | papers-tbh | July 2026</text>

</svg>
